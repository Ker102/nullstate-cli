name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Generate release SBOM
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --upgrade pip
          .sbom-venv/bin/python -m pip install dist/*.whl
          .sbom-venv/bin/python - <<'PY'
          import importlib.metadata
          import json
          import os
          import re
          import tomllib
          from datetime import UTC, datetime
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          package_name = project["name"]
          tag = os.environ["GITHUB_REF_NAME"]
          excluded_tools = {"pip", "setuptools", "wheel"}

          def normalized_name(value):
              return re.sub(r"[-_.]+", "-", value).lower()

          def spdx_id(value):
              normalized = re.sub(r"[^A-Za-z0-9.-]", "-", value)
              return f"SPDXRef-Package-{normalized}"

          installed_distributions = {}
          for distribution in importlib.metadata.distributions():
              name = distribution.metadata.get("Name")
              if not name:
                  continue
              normalized = normalized_name(name)
              if normalized in excluded_tools:
                  continue
              installed_distributions[normalized] = distribution

          root_distribution = installed_distributions.get(normalized_name(package_name))
          if root_distribution is None:
              raise SystemExit(f"Package {package_name!r} was not installed into the SBOM environment.")

          root_id = spdx_id(package_name)
          packages = []
          for _, distribution in sorted(installed_distributions.items()):
              name = distribution.metadata["Name"]
              packages.append(
                  {
                      "SPDXID": spdx_id(name),
                      "copyrightText": "NOASSERTION",
                      "downloadLocation": "NOASSERTION",
                      "filesAnalyzed": False,
                      "licenseConcluded": "NOASSERTION",
                      "licenseDeclared": "NOASSERTION",
                      "name": name,
                      "versionInfo": distribution.version,
                  }
              )

          relationships = [
              {
                  "relatedSpdxElement": root_id,
                  "relationshipType": "DESCRIBES",
                  "spdxElementId": "SPDXRef-DOCUMENT",
              }
          ]
          relationship_keys = {("SPDXRef-DOCUMENT", root_id, "DESCRIBES")}
          for _, distribution in sorted(installed_distributions.items()):
              source_name = distribution.metadata["Name"]
              source_id = spdx_id(source_name)
              for requirement in distribution.requires or []:
                  dependency_name = re.split(r"[<>=!~;\[\], ]", requirement, maxsplit=1)[0]
                  dependency = installed_distributions.get(normalized_name(dependency_name))
                  if dependency is None:
                      continue
                  dependency_id = spdx_id(dependency.metadata["Name"])
                  key = (source_id, dependency_id, "DEPENDS_ON")
                  if key in relationship_keys or source_id == dependency_id:
                      continue
                  relationship_keys.add(key)
                  relationships.append(
                      {
                          "relatedSpdxElement": dependency_id,
                          "relationshipType": "DEPENDS_ON",
                          "spdxElementId": source_id,
                      }
                  )

          sbom = {
              "SPDXID": "SPDXRef-DOCUMENT",
              "creationInfo": {
                  "created": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
                  "creators": ["Tool: nullstate-release-workflow"],
              },
              "dataLicense": "CC0-1.0",
              "documentNamespace": f"https://github.com/Ker102/nullstate-cli/releases/tag/{tag}/sbom.spdx.json",
              "name": f"{package_name}-{root_distribution.version}",
              "packages": packages,
              "relationships": relationships,
              "spdxVersion": "SPDX-2.3",
          }
          Path("dist/sbom.spdx.json").write_text(
              json.dumps(sbom, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Generate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          dist = Path("dist")
          artifacts = []
          for path in sorted(dist.iterdir()):
              if not path.is_file() or path.name == "release-manifest.json":
                  continue
              artifacts.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
              )

          manifest = {
              "schema_version": 1,
              "tag": os.environ["GITHUB_REF_NAME"],
              "generated_at": datetime.now(UTC).isoformat(),
              "artifacts": artifacts,
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: dist/sbom.spdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
