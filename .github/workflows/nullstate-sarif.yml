name: Nullstate SARIF

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  export-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Run nullstate offline scenario
        run: python -m nullstate run examples/aws-public-s3 --offline --mock-agents --runs-dir runs/ci
      - name: Export SARIF
        run: |
          mkdir -p artifacts
          python -m nullstate sarif --runs-dir runs/ci --output artifacts/nullstate.sarif
          python -m nullstate bundle --runs-dir runs/ci
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/nullstate.sarif
      - name: Upload nullstate artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nullstate-ci-run
          path: |
            runs/ci/**
            artifacts/nullstate.sarif
