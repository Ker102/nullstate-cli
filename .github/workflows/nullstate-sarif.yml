name: Nullstate SARIF

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  export-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Run nullstate offline scenario
        run: python -m nullstate run examples/aws-public-s3 --offline --mock-agents --ci --fail-on-severity none --runs-dir runs/ci
      - name: Export SARIF
        run: |
          mkdir -p artifacts
          python -m nullstate sarif --runs-dir runs/ci --output artifacts/nullstate.sarif
          python -m nullstate bundle --runs-dir runs/ci
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7
        with:
          sarif_file: artifacts/nullstate.sarif
      - name: Upload nullstate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nullstate-ci-run
          path: |
            runs/ci/**
            artifacts/nullstate.sarif
